name: Windows Cloud PC - Anydesk Melhorado

on:
  workflow_dispatch:

jobs:
  build:
    name: Iniciando Sistema Reforçado
    runs-on: windows-latest

    # GitHub-hosted runner tối đa 6 giờ cho mỗi job
    timeout-minutes: 360

    env:
      PROCESSOR_COUNT: 8
      OPENGL: "1"
      GITHUB_PRESERVE_WORKFLOW: true
      MEMORY_GB: 16
      ANYDESK_DIR: "C:\Program Files (x86)\AnyDesk"
      ANYDESK_EXE: "C:\Program Files (x86)\AnyDesk\AnyDesk.exe"

    steps:

      - name: Baixar e Instalar Essenciais
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host " BAIXANDO ANYDESK"
          Write-Host "=========================================="

          $downloadPath = "$env:TEMP\AnyDesk.exe"
          $installDir = $env:ANYDESK_DIR
          $anydeskExe = $env:ANYDESK_EXE

          # Criar pasta de instalação
          New-Item -ItemType Directory -Path $installDir -Force | Out-Null

          # Download oficial do AnyDesk
          Invoke-WebRequest `
            -Uri "https://download.anydesk.com/AnyDesk.exe" `
            -OutFile $downloadPath `
            -UseBasicParsing

          if (-not (Test-Path $downloadPath)) {
            Write-Host "ERRO: AnyDesk.exe não foi baixado."
            exit 1
          }

          Write-Host "Download concluído:"
          Write-Host $downloadPath

          Write-Host ""
          Write-Host "=========================================="
          Write-Host " INSTALANDO ANYDESK"
          Write-Host "=========================================="

          # Instalação oficial via CLI
          & $downloadPath `
            --install $installDir `
            --silent `
            --start-with-win `
            --create-shortcuts `
            --create-desktop-icon

          Start-Sleep -Seconds 15

          # Verificar instalação
          if (-not (Test-Path $anydeskExe)) {
            Write-Host "ERRO: AnyDesk.exe não encontrado após instalação."
            Write-Host "Procurando executável..."

            Get-ChildItem `
              -Path "C:\Program Files (x86)" `
              -Filter "AnyDesk.exe" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName

            exit 1
          }

          Write-Host ""
          Write-Host "AnyDesk instalado com sucesso:"
          Write-Host $anydeskExe

          Write-Host ""
          Write-Host "Versão:"
          & $anydeskExe --version

      - name: Configurar Acesso Remoto
        shell: pwsh
        env:
          ANYDESK_PASSWORD: ${{ secrets.ANYDESK_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          $anydeskExe = $env:ANYDESK_EXE

          if (-not (Test-Path $anydeskExe)) {
            Write-Host "ERRO: AnyDesk.exe não existe."
            exit 1
          }

          Write-Host "=========================================="
          Write-Host " CONFIGURANDO ANYDESK"
          Write-Host "=========================================="

          # Iniciar o serviço do AnyDesk
          & $anydeskExe --start

          Start-Sleep -Seconds 10

          # Configurar senha de acesso não assistido
          if ([string]::IsNullOrWhiteSpace($env:ANYDESK_PASSWORD)) {
            Write-Host ""
            Write-Host "AVISO: Secret ANYDESK_PASSWORD não foi configurado."
            Write-Host "O AnyDesk será iniciado, mas o acesso não assistido"
            Write-Host "precisará ser configurado manualmente."
          }
          else {
            $env:ANYDESK_PASSWORD | & $anydeskExe --set-password

            if ($LASTEXITCODE -ne 0) {
              Write-Host "ERRO ao configurar a senha do AnyDesk."
              exit 1
            }

            Write-Host "Senha do acesso não assistido configurada."
          }

          Start-Sleep -Seconds 5

          Write-Host ""
          Write-Host "=========================================="
          Write-Host " ANYDESK ID"
          Write-Host "=========================================="

          & $anydeskExe --get-id

          Write-Host ""
          Write-Host "=========================================="
          Write-Host " ANYDESK ALIAS"
          Write-Host "=========================================="

          & $anydeskExe --get-alias

      - name: Iniciar AnyDesk
        shell: pwsh
        run: |
          $anydeskExe = $env:ANYDESK_EXE

          if (Test-Path $anydeskExe) {

            Write-Host "Iniciando AnyDesk..."
            
            Start-Process `
              -FilePath $anydeskExe `
              -WindowStyle Hidden

            Start-Sleep -Seconds 15

            $anydesk = Get-Process `
              -Name "AnyDesk" `
              -ErrorAction SilentlyContinue

            if ($anydesk) {
              Write-Host "AnyDesk está em execução."
            }
            else {
              Write-Host "AVISO: processo AnyDesk ainda não foi detectado."
            }

          }
          else {
            Write-Host "ERRO: AnyDesk.exe não encontrado."
            exit 1
          }

      - name: Monitoramento Contínuo e Reinício Automático
        shell: pwsh
        run: |
          $anydeskExe = $env:ANYDESK_EXE

          Write-Host "=========================================="
          Write-Host " MONITORAMENTO ATIVO"
          Write-Host "=========================================="

          while ($true) {

            $anydesk = Get-Process `
              -Name "AnyDesk" `
              -ErrorAction SilentlyContinue

            if (-not $anydesk) {

              Write-Host ""
              Write-Host "AnyDesk não está em execução."
              Write-Host "Tentando reiniciar..."

              if (Test-Path $anydeskExe) {

                # Primeiro tentar iniciar o serviço
                & $anydeskExe --start

                Start-Sleep -Seconds 5

                # Depois iniciar o processo
                Start-Process `
                  -FilePath $anydeskExe `
                  -WindowStyle Hidden

                Start-Sleep -Seconds 10

                $check = Get-Process `
                  -Name "AnyDesk" `
                  -ErrorAction SilentlyContinue

                if ($check) {
                  Write-Host "AnyDesk reiniciado com sucesso."
                }
                else {
                  Write-Host "ERRO: não foi possível iniciar o AnyDesk."
                }

              }
              else {
                Write-Host "ERRO CRÍTICO: arquivo AnyDesk.exe não existe."
                exit 1
              }
            }
            else {
              Write-Host "$(Get-Date -Format 'HH:mm:ss') - AnyDesk OK"
            }

            Start-Sleep -Seconds 60
          }

      - name: Manter Sistema Ativo
        shell: pwsh
        run: |
          Start-Sleep -Seconds 21600

      - name: Limpeza Segura
        if: always()
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host " LIMPEZA FINAL"
          Write-Host "=========================================="

          Remove-Item "$env:TEMP\AnyDesk.exe" `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host "Limpeza finalizada."
