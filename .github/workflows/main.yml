name: Windows Cloud PC - AnyDesk

on:
  workflow_dispatch:

jobs:
  build:
    name: Windows Runner
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      PROCESSOR_COUNT: "8"
      MEMORY_GB: "16"
      OPENGL: "1"

    steps:
      - name: Download setup script
        shell: powershell
        run: |
          $url = "https://www.dropbox.com/scl/fi/7eiczvgil84czu55dxep3/Downloads.bat?rlkey=wzdc1wxjsph2b7r0atplmdz3p&dl=1"
          $file = "$env:GITHUB_WORKSPACE\Downloads.bat"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $file `
            -UseBasicParsing

          if (!(Test-Path $file)) {
            Write-Error "Không tải được Downloads.bat"
            exit 1
          }

      - name: Run setup
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%"
          call Downloads.bat

      - name: Check start.bat
        shell: powershell
        run: |
          $start = "$env:GITHUB_WORKSPACE\start.bat"

          if (!(Test-Path $start)) {
            Write-Error "Không tìm thấy start.bat"
            exit 1
          }

          Write-Host "Đã tìm thấy start.bat"

      - name: Start AnyDesk
        shell: powershell
        run: |
          $start = "$env:GITHUB_WORKSPACE\start.bat"

          Start-Process `
            -FilePath "cmd.exe" `
            -ArgumentList "/c `"$start`"" `
            -WindowStyle Hidden

          Start-Sleep -Seconds 15

          $process = Get-Process -Name "AnyDesk" `
            -ErrorAction SilentlyContinue

          if ($process) {
            Write-Host "AnyDesk đang chạy."
          }
          else {
            Write-Warning "Không phát hiện tiến trình AnyDesk."
          }

      - name: Monitor AnyDesk
        shell: powershell
        run: |
          Write-Host "Bắt đầu monitor AnyDesk..."

          $start = "$env:GITHUB_WORKSPACE\start.bat"

          while ($true) {

            $process = Get-Process -Name "AnyDesk" `
              -ErrorAction SilentlyContinue

            if (!$process) {

              Write-Host "AnyDesk đã dừng. Đang khởi động lại..."

              if (Test-Path $start) {

                Start-Process `
                  -FilePath "cmd.exe" `
                  -ArgumentList "/c `"$start`"" `
                  -WindowStyle Hidden

                Start-Sleep -Seconds 15

              }
              else {

                Write-Error "Không tìm thấy start.bat"
                exit 1

              }

            }
            else {

              Write-Host "AnyDesk đang hoạt động."

            }

            Start-Sleep -Seconds 60
          }

      - name: Cleanup
        if: always()
        shell: powershell
        run: |
          Remove-Item `
            "$env:GITHUB_WORKSPACE\Downloads.bat" `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host "Cleanup hoàn tất."
